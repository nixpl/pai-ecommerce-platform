      responses:
        '200':
          description: Wszystkie zamówienia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/MissingToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerErrorOrder'

  /api/orders/{id}:
    servers:
      - url: http://localhost:3004
    get:
      tags: [Orders]
      summary: Szczegóły zamówienia
      description: Klient widzi tylko własne zamówienia; admin widzi wszystkie
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Zamówienie z pozycjami
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/MissingToken'
        '404':
          description: Zamówienie nie znalezione (44003)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          $ref: '#/components/responses/ServerErrorOrder'

  /api/orders/{id}/status:
    servers:
      - url: http://localhost:3004
    patch:
      tags: [Orders]
      summary: Zmiana statusu zamówienia (admin)
      description: |
        Przy anulowaniu (CANCELLED) zwalniane są zarezerwowane stany magazynowe.
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Zaktualizowane zamówienie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Nieprawidłowy status lub niedozwolone przejście (44004)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/MissingToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Zamówienie nie znalezione (44003)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '502':
          description: Błąd komunikacji z Catalog Service przy anulowaniu (44007)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          $ref: '#/components/responses/ServerErrorOrder'
